[project]
name = "jarvis-control-center"
version = "0.1.3"
description = "Backend del Jarvis Control Center"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "psutil>=6.0",
  "cryptography>=44",
  "pywebpush>=2",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests", "../host-agent/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
